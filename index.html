<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>果果游戏大厅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #fdf6e3 0%, #f5e3c0 50%, #ecd3a0 100%);
      color: #3a2f22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px 48px;
    }
    header { text-align: center; margin-bottom: 8px; }
    h1 { font-size: clamp(28px, 7vw, 44px); letter-spacing: 2px; }
    h1 .fruit { font-size: 0.8em; }
    .greet { margin-top: 10px; font-size: 15px; color: #7a6a50; min-height: 22px; }
    .greet a { color: #4caf7d; font-weight: 600; text-decoration: none; cursor: pointer; }
    #hubShowLogin {
      margin-top: 8px;
      font-size: 14px;
      padding: 6px 18px;
      border: 1px solid #d9bd8a;
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      color: #7a6a50;
      cursor: pointer;
    }
    #hubShowLogin:hover { background: #fff; }
    /* ---- 登录卡 ---- */
    .login-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d9bd8a;
      border-radius: 18px;
      padding: 20px;
      margin-top: 16px;
      text-align: center;
    }
    .login-card .lc-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .login-card .lc-title small { font-weight: 400; color: #9a8a6d; }
    .login-card input {
      width: 100%;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid #d9bd8a;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .lc-btns { display: flex; gap: 10px; justify-content: center; }
    .lc-btns button {
      flex: 1;
      font-size: 15px;
      padding: 10px 0;
      border: 1px solid #d9bd8a;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    .lc-btns button.primary { background: #4caf7d; color: #fff; border-color: #4caf7d; }
    .lc-btns button:disabled { opacity: .6; cursor: wait; }
    #hubMsg { font-size: 13px; color: #c0392b; min-height: 18px; margin-top: 8px; }
    #hubMsg.ok { color: #4caf7d; }
    .games {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 780px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d9bd8a;
      border-radius: 18px;
      padding: 22px 20px;
      text-align: center;
      transition: transform .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(122, 90, 40, .18); }
    .card .icon { font-size: 52px; line-height: 1; }
    .card .name { font-size: 21px; font-weight: 800; margin-top: 10px; }
    .card .desc { font-size: 13px; color: #7a6a50; margin-top: 6px; line-height: 1.5; }
    .card .tag {
      position: absolute; top: 12px; right: -30px;
      transform: rotate(35deg);
      background: #e05545; color: #fff;
      font-size: 11px; padding: 3px 34px;
      letter-spacing: 1px;
    }
    .card.coming { opacity: .62; cursor: default; }
    .card.coming:hover { transform: none; box-shadow: none; }
    footer { margin-top: 40px; font-size: 12px; color: #a3947a; }
  </style>
</head>
<body>
  <header>
    <h1><span class="fruit">🍈♟️🀄</span><br/>果果游戏大厅</h1>
    <p class="greet" id="greet">一家人的小游戏合集</p>
    <button id="hubShowLogin" type="button" class="link hidden">登录果果账号</button>
  </header>

  <!-- 登录 (未登录时显示) -->
  <div id="loginCard" class="login-card hidden">
    <p class="lc-title">登录果果账号 <small>(与果果麻将通用)</small></p>
    <input id="hubUser" placeholder="账号" maxlength="16" autocomplete="username" />
    <input id="hubPass" type="password" placeholder="密码" autocomplete="current-password" />
    <input id="hubName" class="hidden" placeholder="昵称(注册时填)" maxlength="8" />
    <div class="lc-btns">
      <button id="hubLogin" type="button" class="primary">登录</button>
      <button id="hubReg" type="button">注册</button>
    </div>
    <p id="hubMsg"></p>
  </div>

  <nav class="games">
    <a class="card" href="/mj/">
      <span class="tag">人气</span>
      <div class="icon">🀄</div>
      <div class="name">果果麻将</div>
      <div class="desc">家规麻将 · 2-4 人联机<br/>混儿万能 · 语音开黑</div>
    </a>
    <a class="card" href="/gmk/">
      <span class="tag">新上架</span>
      <div class="icon">♟️</div>
      <div class="name">果果五子棋</div>
      <div class="desc">15/19 路 · 好友或 AI 对战<br/>支持多局同时开</div>
    </a>
    <a class="card coming" href="javascript:void(0)">
      <div class="icon">🎁</div>
      <div class="name">更多游戏</div>
      <div class="desc">跳棋? 斗地主? UNO?<br/>敬请期待</div>
    </a>
  </nav>

  <footer>同一账号、同一批好友, 玩遍所有果果游戏</footer>

  <script>
    // 大厅登录: 直连果果五子棋 WS (/gmk-ws, 同账号体系), 登录态存同一 token
    const TOKEN_KEY = 'gg_wzq_token';
    const $ = id => document.getElementById(id);
    const greet = $('greet'), loginCard = $('loginCard');

    function showLogin() {
      // 未登录: 只显示小"登录"按钮, 点了才展开登录卡
      loginCard.classList.add('hidden');
      $('hubShowLogin').classList.remove('hidden');
      greet.textContent = '一家人的小游戏合集';
    }
    function showGreet(name) {
      loginCard.classList.add('hidden');
      $('hubShowLogin').classList.add('hidden');
      greet.innerHTML = `👋 欢迎, <b>${name}</b>! 挑一个游戏开始吧 · <a id="hubLogout">退出</a>`;
      $('hubLogout').onclick = () => {
        localStorage.removeItem(TOKEN_KEY);
        showLogin();
        setMsg('已退出登录', true);
      };
    }
    function setMsg(t, ok) { const m = $('hubMsg'); m.textContent = t || ''; m.className = ok ? 'ok' : ''; }

    // 走五子棋 WS 登录/注册, 成功 resolve(auth_ok 消息, 含 token/name), 失败 reject(原因)
    function wsAuth(msg) {
      return new Promise((resolve, reject) => {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        let ws;
        const timer = setTimeout(() => { try { ws && ws.close(); } catch (e) {} reject('服务无响应, 请稍后再试'); }, 10000);
        try { ws = new WebSocket(`${proto}${location.host}/gmk-ws`); } catch (e) { clearTimeout(timer); return reject('无法连接服务'); }
        ws.onmessage = ev => {
          let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (m.t === 'auth_ok') { clearTimeout(timer); ws.close(); resolve(m); }
          else if (m.t === 'auth_fail') { clearTimeout(timer); ws.close(); reject('账号或密码错误'); }
          else if (m.t === 'error') { clearTimeout(timer); ws.close(); reject(m.msg || '操作失败'); }
        };
        ws.onerror = () => { clearTimeout(timer); reject('连接服务失败'); };
        ws.onopen = () => ws.send(JSON.stringify(msg));
      });
    }

    async function doAuth(msg) {
      $('hubLogin').disabled = $('hubReg').disabled = true;
      setMsg('');
      try {
        const m = await wsAuth(msg);
        if (!m.token) throw new Error('服务未返回登录凭据');
        localStorage.setItem(TOKEN_KEY, m.token);
        showGreet(m.name);
        setMsg('✅ 登录成功, 欢迎回来!', true);
      } catch (e) {
        setMsg('⚠ ' + e);
      } finally {
        $('hubLogin').disabled = $('hubReg').disabled = false;
      }
    }

    $('hubShowLogin').addEventListener('click', () => {
      $('hubShowLogin').classList.add('hidden');
      loginCard.classList.remove('hidden');
      $('hubUser').focus();
    });

    $('hubLogin').addEventListener('click', () => {      const user = $('hubUser').value.trim(), pass = $('hubPass').value;
      if (!user || !pass) { setMsg('请输入账号和密码'); return; }
      doAuth({ t: 'login', user, pass });
    });
    $('hubReg').addEventListener('click', () => {
      const nameInput = $('hubName');
      if (nameInput.classList.contains('hidden')) { // 第一次点: 展开昵称栏
        nameInput.classList.remove('hidden');
        nameInput.focus();
        return;
      }
      const user = $('hubUser').value.trim(), pass = $('hubPass').value, name = nameInput.value.trim();
      if (!user || !pass) { setMsg('请输入账号和密码'); return; }
      if (!name) { setMsg('请填写昵称'); return; }
      doAuth({ t: 'register', user, pass, name });
    });

    // 启动: 已有 token 则校验后直接打招呼, 否则只显示小"登录"按钮
    (async () => {
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        try {
          // 绝对路径 /gmk/api/me (大厅自身没有 api; 相对路径会解析成 /hub/api/me 而 404)
          const res = await fetch('/gmk/api/me', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });
          if (res.ok) {
            const j = await res.json();
            showGreet(j.name);
            return;
          }
          if (res.status === 401) {
            // 凭据确实失效才清除
            localStorage.removeItem(TOKEN_KEY);
          }
          // 其他错误(网络抖动等): 保留 token, 不误删登录态
        } catch (e) { /* 网络错误: 保留 token */ }
      }
      showLogin();
    })();
  </script>
</body>
</html>
